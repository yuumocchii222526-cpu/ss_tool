<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f6efe9" />
<title>FF14 SS Editor</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#3d342f;background:#f6efe9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf7f3,#efe6df);min-height:100vh}.app{max-width:920px;margin:auto;padding:14px 14px 34px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.title{font-size:20px;font-weight:800}.pill{font-size:12px;background:#fff7;border:1px solid #ffffffa0;padding:7px 10px;border-radius:999px}.card{background:#ffffffc9;border:1px solid #fff;border-radius:20px;box-shadow:0 10px 30px #6b4f3d18;padding:12px}.stage{position:relative;display:grid;place-items:center;overflow:hidden;background:#ded8d2;border-radius:16px;min-height:44vh}.stage canvas{display:block;max-width:100%;max-height:68vh;touch-action:none}.empty{padding:60px 20px;text-align:center;color:#796b62}.toolbar{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px}.toolbar button,.action{border:0;background:#f0e5dd;color:#4a3e37;padding:11px 14px;border-radius:14px;font-weight:700;white-space:nowrap}.toolbar button.active,.action.primary{background:#4f4139;color:#fff}.panel{margin-top:10px;display:grid;gap:12px}.row{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center}.row label{font-size:13px;font-weight:700}.row output{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}.row input[type=range]{width:100%}.buttons{display:flex;gap:8px;flex-wrap:wrap}.action{cursor:pointer}.action:disabled{opacity:.45}.notice{font-size:12px;line-height:1.55;color:#6f625b;background:#f7f2ee;padding:10px 12px;border-radius:12px}.status{font-size:12px;color:#796b62;margin:10px 2px 0}.footer{font-size:11px;color:#8b7e76;margin-top:12px;text-align:center}@media(max-width:620px){.app{padding:10px 10px 26px}.stage{min-height:46vh}.row{grid-template-columns:90px 1fr 42px}.title{font-size:18px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { FilesetResolver, ImageSegmenter } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';
const $=s=>document.querySelector(s), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const state={source:null,mask:null,segmenter:null,tab:'background',blur:18,feather:2,saturation:0,contrast:0,warmth:0,filter:'natural',watermark:false,maskMode:'add',brush:24};
$('#app').innerHTML=`<div class="app"><div class="topbar"><div class="title">FF14 SS Editor</div><div class="pill">GitHub Pages / 端末内画像処理</div></div><div class="card"><div class="stage"><div class="empty" id="empty">「画像を選ぶ」からSSを読み込んでください。<br>画像ファイル自体はサーバーへアップロードしません。</div><canvas id="canvas" hidden></canvas></div><div class="buttons" style="margin-top:10px"><label class="action primary">画像を選ぶ<input id="file" type="file" accept="image/*" hidden></label><button class="action" id="auto" disabled>人物を自動保護</button><button class="action" id="save" disabled>保存</button><button class="action" id="reset" disabled>リセット</button></div><div class="status" id="status">準備完了</div></div><div class="toolbar" id="tabs"><button data-tab="background" class="active">背景</button><button data-tab="color">色</button><button data-tab="filter">フィルター</button><button data-tab="mask">マスク</button><button data-tab="export">書き出し</button></div><div class="card panel" id="panel"></div><div class="footer">© SQUARE ENIX 表記は必要な画像だけオンにできます。</div></div>`;
const canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
const blurCanvas=document.createElement('canvas'),bctx=blurCanvas.getContext('2d');
const maskCanvas=document.createElement('canvas'),mctx=maskCanvas.getContext('2d',{willReadFrequently:true});
function status(s){$('#status').textContent=s} function enable(v){['#auto','#save','#reset'].forEach(x=>$(x).disabled=!v)}
function fit(w,h,max=1400){const r=Math.min(1,max/Math.max(w,h));return[Math.round(w*r),Math.round(h*r)]}
$('#file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{status('画像を読み込み中…');const bmp=await createImageBitmap(f);const [w,h]=fit(bmp.width,bmp.height);[canvas,work,blurCanvas,maskCanvas].forEach(c=>{c.width=w;c.height=h});wctx.drawImage(bmp,0,0,w,h);state.source=wctx.getImageData(0,0,w,h);mctx.fillStyle='white';mctx.fillRect(0,0,w,h);state.mask=mctx.getImageData(0,0,w,h);$('#empty').hidden=true;canvas.hidden=false;enable(true);render();status('読み込み完了。人物を自動保護できます。')}catch(err){console.error(err);status('画像の読み込みに失敗しました。')}});
async function ensureSegmenter(){if(state.segmenter)return state.segmenter;status('人物分離AIを準備中…');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');state.segmenter=await ImageSegmenter.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter_landscape/float16/latest/selfie_segmenter_landscape.tflite'},runningMode:'IMAGE',outputConfidenceMasks:true,outputCategoryMask:false});return state.segmenter}
$('#auto').onclick=async()=>{try{const seg=await ensureSegmenter();status('人物を判定中…');const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;tmp.getContext('2d').putImageData(state.source,0,0);const r=seg.segment(tmp),cm=r.confidenceMasks?.[0];if(!cm)throw new Error('mask');const a=cm.getAsFloat32Array(),out=mctx.createImageData(canvas.width,canvas.height);for(let i=0;i<a.length;i++){const v=clamp((a[i]-.18)/.65,0,1)*255;out.data[i*4]=255;out.data[i*4+1]=255;out.data[i*4+2]=255;out.data[i*4+3]=v}mctx.putImageData(out,0,0);state.mask=out;render();r.close?.();status('人物を保護しました。必要なら「マスク」で修正してください。')}catch(err){console.error(err);status('人物自動保護の読み込みに失敗しました。通信状態を確認してください。')}};
function colorFilter(){const sat=100+state.saturation,con=100+state.contrast,sep=state.warmth>0?state.warmth*.18:0;let p='';if(state.filter==='soft')p=' brightness(1.04) saturate(.92)';if(state.filter==='pastel')p=' brightness(1.06) saturate(.88) contrast(.94)';if(state.filter==='cinema')p=' contrast(1.08) saturate(.88)';return `saturate(${sat}%) contrast(${con}%) sepia(${sep}%)${p}`}
function featherMask(){const t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;const c=t.getContext('2d');c.filter=`blur(${state.feather}px)`;c.drawImage(maskCanvas,0,0);return t}
function render(){if(!state.source)return;const w=canvas.width,h=canvas.height;wctx.putImageData(state.source,0,0);bctx.clearRect(0,0,w,h);bctx.save();bctx.filter=`blur(${state.blur}px) ${colorFilter()}`;const pad=Math.ceil(state.blur*2);bctx.drawImage(work,-pad,-pad,w+pad*2,h+pad*2);bctx.restore();const fg=document.createElement('canvas');fg.width=w;fg.height=h;const f=fg.getContext('2d');f.save();f.filter=colorFilter();f.drawImage(work,0,0);f.restore();f.globalCompositeOperation='destination-in';f.drawImage(featherMask(),0,0);f.globalCompositeOperation='source-over';ctx.clearRect(0,0,w,h);ctx.drawImage(blurCanvas,0,0);ctx.drawImage(fg,0,0);if(state.watermark){const s=Math.max(12,Math.round(w*.018));ctx.font=`600 ${s}px -apple-system,sans-serif`;ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillText('© SQUARE ENIX',w-s,h-s);ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText('© SQUARE ENIX',w-s-1,h-s-1)}}
function row(label,key,min,max,step=1,unit=''){return `<div class="row"><label>${label}</label><input type="range" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${state[key]}"><output>${state[key]}${unit}</output></div>`}
function panel(){const p=$('#panel');if(state.tab==='background')p.innerHTML=row('背景ぼかし','blur',0,45)+row('境界なじませ','feather',0,8,.5);if(state.tab==='color')p.innerHTML=row('彩度','saturation',-50,50)+row('コントラスト','contrast',-35,35)+row('暖かさ','warmth',-40,40);if(state.tab==='filter')p.innerHTML=`<div class="buttons">${[['natural','自然'],['soft','ふんわり'],['pastel','淡色'],['cinema','シネマ']].map(([v,n])=>`<button class="action ${state.filter===v?'primary':''}" data-filter="${v}">${n}</button>`).join('')}</div>`;if(state.tab==='mask')p.innerHTML=`<div class="buttons"><button class="action ${state.maskMode==='add'?'primary':''}" data-mask="add">＋人物を塗る</button><button class="action ${state.maskMode==='erase'?'primary':''}" data-mask="erase">－背景にする</button></div>${row('ブラシ','brush',6,80,1,'px')}<div class="notice">画像を指でなぞって人物マスクを修正できます。</div>`;if(state.tab==='export')p.innerHTML=`<button class="action ${state.watermark?'primary':''}" id="wm">© SQUARE ENIX ${state.watermark?'ON':'OFF'}</button><div class="notice">保存ボタンでPNGを書き出します。</div>`;p.querySelectorAll('input[type=range]').forEach(el=>el.oninput=e=>{const k=e.target.dataset.key;state[k]=Number(e.target.value);e.target.nextElementSibling.value=`${state[k]}${k==='brush'?'px':''}`;render()});p.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;panel();render()});p.querySelectorAll('[data-mask]').forEach(b=>b.onclick=()=>{state.maskMode=b.dataset.mask;panel()});const wm=$('#wm');if(wm)wm.onclick=()=>{state.watermark=!state.watermark;panel();render()}}
panel();$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));panel()};
let drawing=false;function pos(ev){const r=canvas.getBoundingClientRect(),t=ev.touches?.[0]??ev;return[(t.clientX-r.left)*canvas.width/r.width,(t.clientY-r.top)*canvas.height/r.height]}function paint(ev){if(!drawing||state.tab!=='mask')return;ev.preventDefault();const[x,y]=pos(ev);mctx.save();mctx.beginPath();mctx.arc(x,y,state.brush,0,Math.PI*2);if(state.maskMode==='add'){mctx.globalCompositeOperation='source-over';mctx.fillStyle='white'}else{mctx.globalCompositeOperation='destination-out';mctx.fillStyle='black'}mctx.fill();mctx.restore();state.mask=mctx.getImageData(0,0,canvas.width,canvas.height);render()}canvas.onpointerdown=e=>{drawing=true;paint(e)};canvas.onpointermove=paint;['pointerup','pointercancel','pointerleave'].forEach(n=>canvas.addEventListener(n,()=>drawing=false));
$('#reset').onclick=()=>{if(!state.source)return;Object.assign(state,{blur:18,feather:2,saturation:0,contrast:0,warmth:0,filter:'natural',watermark:false});mctx.fillStyle='white';mctx.fillRect(0,0,canvas.width,canvas.height);panel();render();status('設定をリセットしました。')};
$('#save').onclick=()=>{render();canvas.toBlob(blob=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ff14-ss-edited.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};
</script>
</body>
</html>
